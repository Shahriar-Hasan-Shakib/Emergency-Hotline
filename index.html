<!DOCTYPE html>
<html lang="en" data-theme="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <header class="flex justify-between items-center px-15 py-6">
        <div class="logo flex gap-2 items-center"><img class="h-[50px]" src="./public/assets/logo-dark.png" alt="">
            <h1 class="text-[#006747] font-bold text-2xl leading-7">Emergency <br>Service</h1>
        </div>
        <ul class="flex gap-4">
            <li class="flex items-center gap-2 p-3 bg-[#41FF6B1A] rounded-[50px]"><span id="love">0</span><img class="h-[30px] object-contain" src="./public/assets/heart.png" alt=""></li>
            <li class="flex items-center gap-2 p-3 bg-[#41FF6B1A] rounded-[50px]"><span id="coin">100</span><img class="h-[30px] object-contain" src="./public/assets/coin.png" alt=""></li>
            <li class="flex items-center gap-2 text-[16px] font-semibold p-3 bg-[#41FF6B1A] rounded-[50px] btn-success"><span id="copy">2</span>Copy</li>
        </ul>
    </header>
    <main>
        <section class="h-[239px] text-center text-white flex justify-center flex-col bg-gradient-to-r from-[#023122] via-[#006747] to-[#013223]">
            <img class="h-23 mx-auto" src="./public/assets/logo-dark.png" alt="">
            <h1 class="font-black text-[40px]">Emergency Service Directory</h1>
            <p class="font-semibold text-xl">Government Emergency Services at Your Fingertip – A Project by Government of the People’s Republic of Bangladesh</p>
        </section>
    </main>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
